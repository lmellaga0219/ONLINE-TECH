<body>

    <div class="bg-video-wrap" aria-hidden="true">
        <video
            class="bg-video"
            src="background.mp4"
            autoplay
            loop
            muted
            playsinline
            disablepictureinpicture
            preload="auto"
        ></video>

    <nav>
        <a href="index.html" class="logo">PS<span>code</span></a>

    <!-- ── CONTACT PAGE ───────────────────────────────────── -->
    <main class="contact-page">

        <div class="contact-wrap">

            <!-- Heading -->
            <div class="contact-heading">
                <h1>Let's <span>Chat</span></h1>
                <div class="contact-dot"></div>
            </div>

            <!-- Email pill (non-clickable) -->
            <div class="contact-email-pill">
                <span class="contact-email-icon">
                    <img src="gmail.png" alt="Email">
                </span>
                lmellaga0219@gmail.com
            </div>

            <!-- CTA button -->
            <a href="mailto:lmellaga0219@gmail.com" class="contact-cta-btn">Get in touch</a>

            <!-- Social icon buttons -->
            <div class="contact-socials">

                <!-- LinkedIn -->
                <a href="https://www.linkedin.com/in/ley-ellaga-3abb8a371/" target="_blank" rel="noopener noreferrer" class="contact-social-icon" aria-label="LinkedIn">
                    <img src="linkedin.png" alt="LinkedIn">
                </a>

                <!-- Facebook -->
                <a href="https://www.facebook.com/aleydrei/" target="_blank" rel="noopener noreferrer" class="contact-social-icon" aria-label="Facebook">
                    <img src="facebook.png" alt="Facebook">
                </a>

                <!-- Instagram -->
                <a href="https://www.instagram.com/aley_drei/" target="_blank" rel="noopener noreferrer" class="contact-social-icon" aria-label="Instagram">
                    <img src="instagram.png" alt="Instagram">
                </a>

                <!-- GitHub -->
                <a href="https://github.com/lmellaga0219" target="_blank" rel="noopener noreferrer" class="contact-social-icon" aria-label="GitHub">
                    <img src="github.png" alt="GitHub">
                </a>

            </div>

        </div>

    </main>

    <script src="script.js"></script>
